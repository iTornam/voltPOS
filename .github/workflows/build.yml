name: Build VoltPOS Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"        # pushing a tag like v3.1.0 builds AND uploads installers to a GitHub Release
  workflow_dispatch:

permissions:
  contents: write   # needed to create/upload the GitHub Release

jobs:
  build-mac:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Install Node dependencies
        run: npm install

      - name: Generate build assets
        run: python build/generate_icons.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build macOS (DMG + ZIP)
        # Tag push -> upload to a draft GitHub Release (what the auto-updater reads).
        # Branch push / manual run -> just build, no publishing.
        run: npm run build:mac -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@v5
        with:
          name: VoltPOS-Mac
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Install Node dependencies
        run: npm install

      - name: Generate build assets
        run: python build/generate_icons.py

      - name: Build Windows installer
        run: npm run build:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: VoltPOS-Windows
          path: dist/*.exe
          if-no-files-found: error
