# Cloudflare Worker config for the VoltPOS remote dashboard.
name = "voltpos-remote"          # becomes https://voltpos-remote.<your-subdomain>.workers.dev
main = "worker.js"
compatibility_date = "2024-09-23"

# After running:  npx wrangler kv namespace create VOLT
# paste the id it prints here:
[[kv_namespaces]]
binding = "VOLT"
id = "10b3cf7afb534cb3842cf9d0abc10b8b"
