<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VoltPOS">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<title>VoltPOS Remote</title>
<style>
:root{--bg:#0e1117;--surface:#161b25;--surface2:#1e2533;--border:#2a3345;--text:#e8ecf4;--muted:#8592ad;--accent:#f5c400;--success:#3db87a;--danger:#e05252;--warn:#e8a33d;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.brand{font-weight:700;letter-spacing:.04em;color:var(--accent)}.brand span{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 12px}
.input:focus{outline:none;border-color:var(--accent)}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}.err{color:var(--danger);min-height:20px;font-size:13px}
/* login */
.login{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:22px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top .who{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tab{white-space:nowrap;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab.on{border-color:var(--accent);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--success)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px}
/* grids */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:12px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:2px}.kpi .s{font-size:11px;color:var(--muted)}
.pos{color:var(--success)}.neg{color:var(--danger)}.acc{color:var(--accent)}
h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}td.r,th.r{text-align:right;font-family:var(--mono);white-space:nowrap}
tr:last-child td{border-bottom:none}
.badge{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--muted)}
.badge.cr{border-color:var(--danger);color:var(--danger)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9;position:relative}
.bar.today{opacity:1;box-shadow:0 0 0 2px var(--accent)44}
.bl{display:flex;gap:5px;font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:4px}.bl span{flex:1;text-align:center}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.prow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;margin-bottom:6px}
.alert.bad{border-color:var(--danger)}.alert.warn{border-color:var(--warn)}.alert.good{border-color:var(--success);color:var(--success)}
.chip{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);margin-left:6px}
.chip.up{color:var(--success);border-color:var(--success)}.chip.down{color:var(--danger);border-color:var(--danger)}
.bar{cursor:pointer}.bar.sel{outline:2px solid var(--text);outline-offset:1px}
.dayinfo{margin-top:10px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}.dayinfo b{font-family:var(--mono)}
@media (prefers-color-scheme:light){
 :root{--bg:#f3f5f9;--surface:#ffffff;--surface2:#eef1f6;--border:#d6dce8;--text:#1b2230;--muted:#5b6882;--accent:#b88700;--success:#1f9d62;--danger:#c93c3c;--warn:#b9791a}
 .btn.primary{color:#fff}.bar{opacity:1}
}
.srow{padding:9px 2px;border-bottom:1px solid var(--border);cursor:pointer}.srow:last-child{border-bottom:none}
.srow .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.srow .items{margin:8px 0 2px;padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:12.5px}
.srow .items div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.dayh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;padding:10px 2px 4px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip2{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12px}.chip2.on{border-color:var(--accent);color:var(--accent)}
.frow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.frow .lbl{width:100%;font-size:11px;color:var(--muted)}.frow .input{padding:8px 10px;min-width:0;flex:1}
.imsg{font-size:13px;margin:0 0 8px}.imsg.ok{color:var(--success)}.imsg.bad{color:var(--danger)}
.addbox{border:1px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.foot{margin:22px 0 8px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),S={token:sessionStorage.getItem('vp_tok')||'',data:null,sel:'all',timer:null,hide:localStorage.getItem('vp_hide_profit')==='1',day:{},q:{},open:{},inv:{}};

// tiny safe DOM builder: text is always set as text, never as HTML
function h(tag,attrs){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));}return e;}
function api(path,opt){opt=opt||{};var hd={'Content-Type':'application/json'};if(S.token)hd.Authorization='Bearer '+S.token;
  return fetch(path,{method:opt.method||'GET',headers:hd,body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().then(function(j){j._status=r.status;return j;});});}
function money(n,cur){n=Number(n)||0;return (cur||'GH₵')+' '+n.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pv(n,cur){return S.hide?'••••':money(n,cur);} // profit values respect the Hide-profit switch
function num(n){return (Number(n)||0).toLocaleString('en-GH');}
function ago(ms,now){var m=Math.max(0,Math.round((now-ms)/60000));if(m<1)return 'just now';if(m<60)return m+' min ago';var hr=Math.round(m/60);if(hr<24)return hr+' hr ago';return Math.round(hr/24)+' days ago';}
function fresh(ms,now){if(!ms)return 'bad';var m=(now-ms)/60000;return m<=45?'ok':m<=180?'warn':'bad';}
function when(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleString('en-GH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function shortDay(d){var x=new Date(d+'T12:00:00');return isNaN(x)?d.slice(5):x.toLocaleDateString('en-GH',{weekday:'narrow'});}

// ── login ──
function showLogin(msg){
  clearInterval(S.timer);S.token='';sessionStorage.removeItem('vp_tok');
  var acct=h('input',{class:'input',placeholder:'Account code',autocomplete:'username',autocapitalize:'characters',spellcheck:'false'});
  var pw=h('input',{class:'input',type:'password',placeholder:'Password',autocomplete:'current-password'});
  var err=h('div',{class:'err',text:msg||''});
  var go=h('button',{class:'btn primary',text:'Sign in'});
  function submit(){err.textContent='';go.disabled=true;
    api('/api/login',{method:'POST',body:{account:acct.value,password:pw.value}}).then(function(r){go.disabled=false;
      if(!r.ok){err.textContent=r.error||'Could not sign in.';return;}
      S.token=r.token;sessionStorage.setItem('vp_tok',r.token);S.sel='all';load();
    }).catch(function(){go.disabled=false;err.textContent='No internet connection.';});}
  go.addEventListener('click',submit);pw.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  app.replaceChildren(h('div',{class:'login'},h('div',{class:'brand',text:'⚡ VOLT'},h('span',{text:'POS'})),h('h1',{text:'Shop dashboard'}),
    h('div',{class:'muted',text:'Sign in to see how your shops are doing.'}),acct,pw,err,go));
  acct.focus();
}

// ── data ──
function load(auto){
  api('/api/data').then(function(r){
    if(r._status===401){showLogin('Please sign in again.');return;}
    if(!r.ok){return;}
    var ae=document.activeElement;
    if(auto===true&&ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA')){S.data=r;return;} // don't wipe a form while it is being filled in
    S.data=r;render();
    clearInterval(S.timer);S.timer=setInterval(function(){load(true);},60000);
  }).catch(function(){if(S.data){S.data.offline=true;render();}});
}

// ── aggregate across shops ──
function sumSnap(shops,get){return shops.reduce(function(a,s){return a+(s.snapshot?(Number(get(s.snapshot))||0):0);},0);}

function kpi(label,value,sub,cls,extra){return h('div',{class:'card kpi'},h('div',{class:'l',text:label}),h('div',{class:'v '+(cls||''),text:value}),sub?h('div',{class:'s',text:sub}):null,extra||null);}

function attention(shops,now){
  var out=[],multi=shops.length>1;
  shops.forEach(function(s){var nm=multi?s.name+': ':'';
    if(!s.receivedAt){out.push({lv:'warn',t:nm+'has not sent any data yet.'});return;}
    var m=(now-s.receivedAt)/60000;
    if(m>180)out.push({lv:'bad',t:nm+'last update was '+ago(s.receivedAt,now)+'. The shop computer may be off or offline.'});
    var sn=s.snapshot;if(!sn)return;
    if(sn.outCount>0)out.push({lv:'warn',t:nm+num(sn.outCount)+(sn.outCount===1?' product is':' products are')+' sold out.'});
    var lowOnly=(sn.lowCount||0)-(sn.outCount||0);
    if(lowOnly>0)out.push({lv:'warn',t:nm+num(lowOnly)+' running low on stock.'});
    if(sn.outstandingCredit>0){var n=(sn.creditCustomers||[]).length;out.push({lv:'info',t:nm+money(sn.outstandingCredit,sn.currency)+' owed by '+n+(n===1?' customer.':' customers.')});}
  });
  return out;
}
function attentionBox(list){
  var box=h('div',{style:'margin-bottom:12px'},h('h2',{text:'Needs attention'}));
  if(!list.length){box.appendChild(h('div',{class:'alert good',text:'✓ Nothing needs attention right now.'}));return box;}
  list.forEach(function(a){box.appendChild(h('div',{class:'alert '+(a.lv==='info'?'':a.lv)},h('span',{text:a.lv==='bad'?'🔴':a.lv==='warn'?'🟠':'ℹ️'}),h('span',{text:a.t})));});
  return box;
}
function periodCard(title,o,cur,fields){
  var card=h('div',{class:'card'},h('div',{class:'muted',style:'font-size:12px;margin-bottom:6px',text:title}));
  fields.forEach(function(f){var v=Number(o[f[1]])||0;
    card.appendChild(h('div',{class:'prow'},h('span',{class:'muted',text:f[0]}),h('span',{class:'mono '+(f[1]==='profit'&&!S.hide?(v>=0?'pos':'neg'):''),text:f[2]?num(v):(f[1]==='profit'?pv(v,cur):money(v,cur))})));});
  return card;
}
function renderAll(box,d){
  var shops=d.shops,cur=(shops.find(function(s){return s.snapshot;})||{snapshot:{}}).snapshot.currency||'GH₵';
  var rev=sumSnap(shops,function(x){return x.today.revenue;}),pr=sumSnap(shops,function(x){return x.today.profit;});
  box.appendChild(attentionBox(attention(shops,d.now)));
  box.appendChild(h('h2',{text:'All shops — today'}));
  box.appendChild(h('div',{class:'grid'},
    kpi('Revenue',money(rev,cur),shops.length+' shops','acc'),
    kpi('Profit',pv(pr,cur),'after cost & expenses',S.hide?'':(pr>=0?'pos':'neg')),
    kpi('Sales',num(sumSnap(shops,function(x){return x.today.sales;})),'transactions'),
    kpi('Cash',money(sumSnap(shops,function(x){return x.today.cash;}),cur)),
    kpi('MoMo / Card',money(sumSnap(shops,function(x){return x.today.digital;}),cur)),
    kpi('Credit owed',money(sumSnap(shops,function(x){return x.outstandingCredit;}),cur),'all unpaid','neg')));
  var tot=function(k){return{revenue:sumSnap(shops,function(x){return x[k].revenue;}),profit:sumSnap(shops,function(x){return x[k].profit;}),sales:sumSnap(shops,function(x){return x[k].sales;})};};
  var fl=[['Revenue','revenue'],['Profit','profit'],['Sales','sales',1]];
  box.appendChild(h('h2',{text:'Totals'}));
  box.appendChild(h('div',{class:'grid2'},periodCard('Last 7 days',tot('d7'),cur,fl),periodCard('Last 30 days',tot('d30'),cur,fl)));
  box.appendChild(h('h2',{text:'Each shop'}));
  var tb=h('table');tb.appendChild(h('tr',null,h('th',{text:'Shop'}),h('th',{class:'r',text:'Today'}),h('th',{class:'r',text:'Profit'}),h('th',{text:'Updated'})));
  shops.forEach(function(s){var sn=s.snapshot;
    var tr=h('tr',{style:'cursor:pointer',onclick:function(){S.sel=s.id;render();}},
      h('td',null,h('span',{class:'dot '+fresh(s.receivedAt,d.now)}),' ',s.name),
      h('td',{class:'r',text:sn?money(sn.today.revenue,sn.currency):'—'}),
      h('td',{class:'r',text:sn?pv(sn.today.profit,sn.currency):'—'}),
      h('td',{class:'muted',text:s.receivedAt?ago(s.receivedAt,d.now):'waiting'}));
    tb.appendChild(tr);});
  box.appendChild(h('div',{class:'card'},tb));
}

function listCard(title,rows,empty){return h('div',null,h('h2',{text:title}),h('div',{class:'card'},rows||h('div',{class:'empty',text:empty})));}

function invState(id){return S.inv[id]||(S.inv[id]={q:'',f:'all',open:null,more:false,add:false,d:{},a:{},ok:'',err:''});}
function describeChange(c,cur){
  if(c.type==='restock')return 'Restock +'+num(c.qty)+' × '+c.name;
  if(c.type==='price')return 'Price of '+c.name+' → '+money(c.price,cur);
  if(c.type==='low')return 'Low-stock level of '+c.name+' → '+num(c.low);
  if(c.type==='add')return 'Add new product: '+c.name+' ('+money(c.price,cur)+', '+num(c.stock||0)+' in stock)';
  return 'Change';
}
function inventorySection(sn,s,cur,d){
  var box=h('div'),inv=sn.inventory;
  box.appendChild(h('h2',{text:'Inventory'+(Array.isArray(inv)?' ('+num(sn.inventoryTotal||inv.length)+' products)':'')}));
  if(!Array.isArray(inv)){box.appendChild(h('div',{class:'card'},h('div',{class:'empty',text:'This shop is running an older VoltPOS version. Update the shop app to see its inventory here and to send stock changes.'})));return box;}
  var st=invState(s.id),card=h('div',{class:'card',id:'inv-card'}),list=h('div'),more=h('div',{style:'margin-top:8px'});
  var stale=!s.receivedAt||(d.now-s.receivedAt)/60000>180;
  function send(change,summary,done){
    if(!window.confirm('Send to '+s.name+'?\n\n'+summary+'\n\nThe shop applies it when its computer is online, after someone there approves it (unless the shop applies changes automatically).'))return;
    api('/api/changes',{method:'POST',body:{shop:s.id,change:change}}).then(function(r){
      if(!r.ok){st.err=r.error||'Could not send.';st.ok='';}
      else{st.ok='Sent to '+s.name+'. '+(stale?'The shop looks offline right now, so it will apply once the shop computer is back online.':'It will show as applied once the shop has dealt with it.');st.err='';if(done)done();}
      load(false);
    }).catch(function(){st.err='No internet connection.';st.ok='';render();});
  }
  if(st.ok)card.appendChild(h('div',{class:'imsg ok',text:st.ok}));
  if(st.err)card.appendChild(h('div',{class:'imsg bad',text:st.err}));
  var search=h('input',{class:'input',type:'search',placeholder:'Search name, category or barcode',autocomplete:'off',style:'margin-bottom:8px'});search.value=st.q;
  var chips=h('div',{class:'chips'});
  [['all','All'],['low','Low stock'],['out','Sold out']].forEach(function(f){chips.appendChild(h('button',{class:'chip2'+(st.f===f[0]?' on':''),text:f[1],onclick:function(){st.f=f[0];st.open=null;render();}}));});
  chips.appendChild(h('button',{class:'chip2'+(st.add?' on':''),text:st.add?'✕ Close':'＋ Add product',onclick:function(){st.add=!st.add;render();}}));
  card.appendChild(search);card.appendChild(chips);
  if(st.add){
    var a=st.a,cats=[];inv.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat);});
    var dl=h('datalist',{id:'cats-'+s.id});cats.forEach(function(c){dl.appendChild(h('option',{value:c}));});
    function fld(key,ph,type,flex){var i=h('input',{class:'input',type:type||'text',placeholder:ph,autocomplete:'off',style:flex?'flex:'+flex:''});if(type==='number'){i.min='0';i.step='any';}i.value=a[key]||'';i.addEventListener('input',function(){a[key]=i.value;});return i;}
    var cat=fld('cat','Category (e.g. General)');cat.setAttribute('list','cats-'+s.id);
    var form=h('div',{class:'addbox'},h('div',{class:'muted',style:'font-size:12px;margin-bottom:4px',text:'New product for '+s.name}),dl,
      h('div',{class:'frow'},fld('name','Product name *','text',2)),h('div',{class:'frow'},cat),
      h('div',{class:'frow'},fld('price','Selling price *','number'),fld('cost','Cost price','number')),
      h('div',{class:'frow'},fld('stock','Opening stock','number'),fld('low','Low-stock level','number'),fld('barcode','Barcode')));
    form.appendChild(h('button',{class:'btn primary',text:'Send to shop',onclick:function(){
      if(!String(a.name||'').trim()){st.err='Enter the product name.';st.ok='';render();return;}
      if(a.price===undefined||a.price===''||isNaN(Number(a.price))){st.err='Enter the selling price.';st.ok='';render();return;}
      send({type:'add',name:a.name,cat:a.cat,price:a.price,cost:a.cost,stock:a.stock,low:a.low,barcode:a.barcode},'Add new product: '+a.name+' at '+money(a.price,cur)+(a.stock?', '+a.stock+' in stock':''),function(){st.a={};st.add=false;});}}));
    card.appendChild(form);
  }
  function editPanel(p){
    var dd=st.d[p.id]||(st.d[p.id]={}),panel=h('div',{class:'items'});
    panel.appendChild(h('div',null,h('span',{class:'muted',text:'Selling price'}),h('span',{class:'mono',text:money(p.price,cur)})));
    panel.appendChild(h('div',null,h('span',{class:'muted',text:'Cost price'}),h('span',{class:'mono',text:pv(p.cost,cur)})));
    panel.appendChild(h('div',null,h('span',{class:'muted',text:'Low-stock level'}),h('span',{class:'mono',text:num(p.low)})));
    function inp(key,ph,step){var i=h('input',{class:'input',type:'number',min:'0',step:step||'any',placeholder:ph});i.value=dd[key]||'';i.addEventListener('input',function(){dd[key]=i.value;});return i;}
    function btn(label,fn){return h('button',{class:'btn primary',text:label,onclick:fn});}
    function bad(msg){st.err=msg;st.ok='';render();}
    var base={product:p.id,name:p.name};
    var qty=inp('qty','Add how many?','1'),rcost=inp('cost','New cost (optional)');
    panel.appendChild(h('div',{class:'frow'},h('div',{class:'lbl',text:'Restock: add to the current '+num(p.stock)}),qty,rcost,btn('Send',function(){
      var q=Number(dd.qty);if(!Number.isInteger(q)||q<1)return bad('Enter a whole number to add (1 or more).');
      send(Object.assign({type:'restock',qty:q},base,dd.cost!==undefined&&dd.cost!==''?{cost:dd.cost}:{}),'Restock +'+q+' × '+p.name+' (now '+p.stock+')',function(){dd.qty='';dd.cost='';});})));
    var price=inp('price','New selling price');
    panel.appendChild(h('div',{class:'frow'},h('div',{class:'lbl',text:'Change the selling price'}),price,btn('Send',function(){
      if(dd.price===undefined||dd.price===''||isNaN(Number(dd.price))||Number(dd.price)<0)return bad('Enter the new price.');
      send(Object.assign({type:'price',price:dd.price},base),'Change the price of '+p.name+' from '+money(p.price,cur)+' to '+money(dd.price,cur),function(){dd.price='';});})));
    var low=inp('low','New low-stock level','1');
    panel.appendChild(h('div',{class:'frow'},h('div',{class:'lbl',text:'Change the low-stock level'}),low,btn('Send',function(){
      var v=Number(dd.low);if(dd.low===undefined||dd.low===''||!Number.isInteger(v)||v<0)return bad('Enter a whole number (0 or more).');
      send(Object.assign({type:'low',low:v},base),'Set the low-stock level of '+p.name+' to '+v,function(){dd.low='';});})));
    return panel;
  }
  function paint(){
    list.replaceChildren();more.replaceChildren();
    var toks=st.q.toLowerCase().split(/\s+/).filter(Boolean);
    var rows=inv.filter(function(p){
      if(st.f==='low'&&!(p.stock>0&&p.stock<=p.low))return false;
      if(st.f==='out'&&!(p.stock<=0))return false;
      if(!toks.length)return true;
      var hay=(p.name+' '+p.cat+' '+p.barcode).toLowerCase();return toks.every(function(t){return hay.indexOf(t)>=0;});});
    if(!rows.length){list.appendChild(h('div',{class:'empty',text:inv.length?'No products match.':'No products yet.'}));return;}
    (st.more?rows:rows.slice(0,60)).forEach(function(p){
      var open=st.open===p.id;
      var row=h('div',{class:'srow'},h('div',{class:'top2',onclick:function(){st.open=open?null:p.id;paint();}},
        h('div',null,h('div',{text:p.name}),h('div',{class:'muted',style:'font-size:11px',text:[p.cat,p.barcode].filter(Boolean).join(' · ')})),
        h('div',{style:'text-align:right'},h('div',{class:'mono '+(p.stock<=0?'neg':p.stock<=p.low?'acc':''),text:p.stock<=0?'OUT':num(p.stock)+' in stock'}),h('div',{class:'muted mono',style:'font-size:11px',text:money(p.price,cur)}))));
      if(open)row.appendChild(editPanel(p));
      list.appendChild(row);});
    if(!st.more&&rows.length>60)more.appendChild(h('button',{class:'btn',text:'Show all '+rows.length,onclick:function(){st.more=true;paint();}}));
  }
  search.addEventListener('input',function(){st.q=search.value;st.more=false;paint();});
  paint();card.appendChild(list);card.appendChild(more);
  if((sn.inventoryTotal||0)>inv.length)card.appendChild(h('div',{class:'muted',style:'font-size:12px;margin-top:8px',text:'Showing the first '+inv.length+' of '+sn.inventoryTotal+' products.'}));
  box.appendChild(card);return box;
}
function changesSection(s,d,cur){
  var list=s.changes||[];if(!list.length)return null;
  var box=h('div');box.appendChild(h('h2',{text:'Your changes to '+s.name}));
  var card=h('div',{class:'card'}),waiting=list.filter(function(c){return c.status==='pending';}).length;
  if(waiting&&(!s.receivedAt||(d.now-s.receivedAt)/60000>180))card.appendChild(h('div',{class:'imsg bad',text:'The shop computer looks offline. '+waiting+' change'+(waiting===1?'':'s')+' will apply when it is back online.'}));
  list.slice(0,15).forEach(function(c){
    var chip=c.status==='pending'?['⏳ waiting for the shop','']:c.status==='applied'?['✓ applied','pos']:c.status==='rejected'?['✗ rejected by the shop','neg']:['⚠ failed','neg'];
    card.appendChild(h('div',{class:'srow',style:'cursor:default'},h('div',{class:'top2'},
      h('div',null,h('div',{text:describeChange(c,cur)}),h('div',{class:'muted',style:'font-size:11px',text:when(new Date(c.at).toISOString())+(c.note?' · '+c.note:'')})),
      h('div',{class:chip[1],style:'font-size:12px;white-space:nowrap',text:chip[0]}))));});
  box.appendChild(card);return box;
}

function dayKey(iso){var d=new Date(iso);return isNaN(d)?'':d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dayLabel(iso){var d=new Date(iso);if(isNaN(d))return '';var n=new Date(),y=new Date(n.getTime()-864e5);
  if(dayKey(iso)===dayKey(n.toISOString()))return 'Today';if(dayKey(iso)===dayKey(y.toISOString()))return 'Yesterday';
  return d.toLocaleDateString('en-GH',{weekday:'long',day:'numeric',month:'short'});}
function clock(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('en-GH',{hour:'2-digit',minute:'2-digit'});}
function salesSection(sn,cur,shopId){
  var list=Array.isArray(sn.recentSales)?sn.recentSales:[];
  var legacy=list.length&&typeof list[0].items==='number'; // shops on an older app only send a count
  var box=h('div'),listBox=h('div'),note=h('div',{class:'muted',style:'font-size:12px;margin-top:8px'});
  var search=h('input',{class:'input',type:'search',placeholder:'Search customer or product',autocomplete:'off',style:'margin-bottom:6px'});
  search.value=S.q[shopId]||'';
  function paint(){
    var q=(S.q[shopId]||'').trim().toLowerCase();listBox.replaceChildren();
    var shown=list.filter(function(x){if(!q)return true;
      if(String(x.customer||'').toLowerCase().indexOf(q)>=0)return true;
      return Array.isArray(x.items)&&x.items.some(function(i){return String(i.n).toLowerCase().indexOf(q)>=0;});});
    if(!shown.length){listBox.appendChild(h('div',{class:'empty',text:list.length?'No sales match "'+S.q[shopId]+'".':'No sales in the last 7 days.'}));return;}
    var lastDay=null,grp=null,tot=0,hd=null,sum=0;
    function closeGroup(){if(hd)hd.lastChild.textContent=money(sum,cur);}
    shown.forEach(function(x){var dk=dayKey(x.date);
      if(dk!==lastDay){closeGroup();lastDay=dk;sum=0;hd=h('div',{class:'dayh'},h('span',{text:dayLabel(x.date)}),h('span',{text:''}));listBox.appendChild(hd);}
      sum+=Number(x.total)||0;
      var key=shopId+'|'+x.id,open=!!S.open[key],detailed=Array.isArray(x.items);
      var row=h('div',{class:'srow',onclick:function(){if(!detailed)return;S.open[key]=!S.open[key];paint();}},
        h('div',{class:'top2'},
          h('div',null,h('div',{text:x.customer||'Walk-in'}),
            h('div',{class:'muted',style:'font-size:11px',text:(x.id||'')+' · '+clock(x.date)+' · '+(x.payment||'')+' · '+(detailed?x.items.length+(x.more?'+'+x.more:'')+(x.items.length+x.more===1?' item':' items'):(x.items+(x.items===1?' item':' items')))}),
            x.unpaid?h('span',{class:'badge cr',text:'credit unpaid'}):null),
          h('div',{class:'mono',style:'white-space:nowrap',text:money(x.total,cur)+(detailed?(open?' ▾':' ▸'):'')})));
      if(open&&detailed){var it=h('div',{class:'items'});
        x.items.forEach(function(i){it.appendChild(h('div',null,h('span',{text:i.q+' × '+i.n}),h('span',{class:'mono muted',text:money(i.q*i.p,cur)})));});
        if(x.more)it.appendChild(h('div',null,h('span',{class:'muted',text:'+ '+x.more+' more item'+(x.more===1?'':'s')}),h('span')));
        if(x.discount>0)it.appendChild(h('div',null,h('span',{class:'muted',text:'Discount'}),h('span',{class:'mono muted',text:'− '+money(x.discount,cur)})));
        row.appendChild(it);}
      listBox.appendChild(row);});
    closeGroup();
  }
  search.addEventListener('input',function(){S.q[shopId]=search.value;paint();});
  paint();
  var total7=typeof sn.salesCount7==='number'?sn.salesCount7:list.length;
  note.textContent=legacy?'This shop is running an older VoltPOS version that sends only its last '+list.length+' sales. Update the shop app to see all 7 days with items.'
    :(total7>list.length?'Showing the latest '+list.length+' of '+total7+' sales from the last 7 days.':'All '+list.length+' sale'+(list.length===1?'':'s')+' from the last 7 days.');
  box.appendChild(h('h2',{text:'Sales: last 7 days'}));
  box.appendChild(h('div',{class:'card',id:'sales-card'},search,listBox,note));
  return box;
}

function renderShop(box,s,d){
  var sn=s.snapshot;
  if(!sn){box.appendChild(h('div',{class:'card'},h('div',{class:'empty',text:'This shop has not sent any data yet. It will appear once the shop computer is online with Remote Dashboard switched on.'})));return;}
  var cur=sn.currency||'GH₵',t=sn.today||{},d7=sn.d7||{},d30=sn.d30||{};
  box.appendChild(attentionBox(attention([s],d.now)));
  var dl=Array.isArray(sn.days)?sn.days:[],yv=null;
  if(dl.length>1&&dl[dl.length-1].d===t.date)yv=dl[dl.length-2].revenue;
  var cmp=null;
  if(yv!==null){var pct=yv>0?Math.round(((t.revenue||0)-yv)/yv*100):null;
    cmp=h('div',{class:'s'},'Yesterday '+money(yv,cur),pct===null?null:h('span',{class:'chip '+(pct>=0?'up':'down'),text:(pct>=0?'▲ ':'▼ ')+Math.abs(pct)+'%'}));}
  box.appendChild(h('h2',{text:'Today'}));
  box.appendChild(h('div',{class:'grid'},
    kpi('Revenue',money(t.revenue,cur),num(t.sales)+' sales','acc',cmp),
    kpi('Profit',pv(t.profit,cur),'after cost & expenses',S.hide?'':((t.profit||0)>=0?'pos':'neg')),
    kpi('Cash',money(t.cash,cur)),kpi('MoMo / Card',money(t.digital,cur)),
    kpi('Expenses',money(t.expenses,cur)),kpi('Credit owed',money(sn.outstandingCredit,cur),'all unpaid','neg')));
  var fl=[['Revenue','revenue'],['Expenses','expenses'],['Profit','profit'],['Sales','sales',1]];
  box.appendChild(h('div',{class:'grid2'},periodCard('Last 7 days',d7,cur,fl),periodCard('Last 30 days',d30,cur,fl)));

  var days=Array.isArray(sn.days)?sn.days:[];
  if(days.length){var max=Math.max.apply(null,days.map(function(x){return x.revenue||0;}).concat([1]));
    var sel=S.day[s.id];if(sel==null||sel<0||sel>=days.length)sel=days.length-1;
    var bars=h('div',{class:'bars'}),lbl=h('div',{class:'bl'});
    days.forEach(function(x,i){var b=h('div',{class:'bar'+(i===days.length-1?' today':'')+(i===sel?' sel':''),title:x.d,onclick:function(){S.day[s.id]=i;render();}});
      b.style.height=Math.max(2,Math.round((x.revenue||0)/max*100))+'%';bars.appendChild(b);lbl.appendChild(h('span',{text:shortDay(x.d)}));});
    var dd=days[sel],dn=new Date(dd.d+'T12:00:00'),dlabel=isNaN(dn)?dd.d:dn.toLocaleDateString('en-GH',{weekday:'short',day:'numeric',month:'short'});
    var info=h('div',{class:'dayinfo'},h('span',{text:dlabel}),h('span',null,'Revenue ',h('b',{text:money(dd.revenue,cur)})),h('span',null,'Profit ',h('b',{text:pv(dd.profit,cur)})));
    box.appendChild(h('h2',{text:'Revenue, last '+days.length+' days (tap a bar)'}));box.appendChild(h('div',{class:'card'},bars,lbl,info));}

  box.appendChild(inventorySection(sn,s,cur,d));
  var chg=changesSection(s,d,cur);if(chg)box.appendChild(chg);
  box.appendChild(salesSection(sn,cur,s.id));
  var two=h('div',{class:'two'});
  var cc=(sn.creditCustomers||[]),ct=null;
  if(cc.length){ct=h('table');cc.forEach(function(x){ct.appendChild(h('tr',null,h('td',{text:x.name}),h('td',{class:'r neg',text:money(x.amount,cur)})));});}
  two.appendChild(listCard('Who owes money',ct,'No unpaid credit.'));
  var ls=(sn.lowStock||[]),lt=null;
  if(ls.length){lt=h('table');ls.forEach(function(x){lt.appendChild(h('tr',null,h('td',{text:x.name}),h('td',{class:'r '+(x.stock<=0?'neg':'acc'),text:x.stock<=0?'OUT':x.stock+' left'})));});
    if(sn.lowCount>ls.length)lt.appendChild(h('tr',null,h('td',{class:'muted',text:'+'+(sn.lowCount-ls.length)+' more'}),h('td')));}
  two.appendChild(listCard('Low stock'+(sn.outCount?' ('+sn.outCount+' sold out)':''),lt,'All products have enough stock.'));
  var tp=(sn.topProducts||[]),tt=null;
  if(tp.length){tt=h('table');tp.forEach(function(x){tt.appendChild(h('tr',null,h('td',{text:x.name}),h('td',{class:'r',text:num(x.qty)+' sold'})));});}
  two.appendChild(listCard('Best sellers (30 days)',tt,'No sales in the last 30 days.'));
  var ex=(sn.recentExpenses||[]),et=null;
  if(ex.length){et=h('table');ex.forEach(function(x){et.appendChild(h('tr',null,h('td',null,h('div',{text:x.desc||x.cat}),h('div',{class:'muted',style:'font-size:11px',text:(x.cat||'')+' · '+x.date})),h('td',{class:'r',text:money(x.amount,cur)})));});}
  two.appendChild(listCard('Recent expenses',et,'No expenses logged.'));
  box.appendChild(two);
}

function render(){
  var d=S.data;if(!d)return;
  var multi=d.shops.length>1;if(!multi)S.sel=d.shops[0].id;
  if(S.sel!=='all'&&!d.shops.some(function(s){return s.id===S.sel;}))S.sel=multi?'all':d.shops[0].id;
  var root=h('div');
  root.appendChild(h('div',{class:'top'},h('div',null,h('div',{class:'brand',text:'⚡ VOLT'},h('span',{text:'POS'})),h('div',{class:'who',text:d.name})),
    h('div',null,h('button',{class:'btn',text:S.hide?'👁 Show profit':'🙈 Hide profit',onclick:function(){S.hide=!S.hide;localStorage.setItem('vp_hide_profit',S.hide?'1':'0');render();}}),' ',h('button',{class:'btn',text:'Refresh',onclick:function(){load(false);}}),' ',h('button',{class:'btn',text:'Sign out',onclick:function(){showLogin('');}}))));
  if(multi||true){var tabs=h('div',{class:'tabs'});
    if(multi)tabs.appendChild(h('button',{class:'tab'+(S.sel==='all'?' on':''),text:'All shops',onclick:function(){S.sel='all';render();}}));
    d.shops.forEach(function(s){tabs.appendChild(h('button',{class:'tab'+(S.sel===s.id?' on':''),onclick:function(){S.sel=s.id;render();}},h('span',{class:'dot '+fresh(s.receivedAt,d.now)}),s.name));});
    root.appendChild(tabs);}
  var box=h('div');
  if(d.offline)box.appendChild(h('div',{class:'card err',text:'You are offline. Showing the last data loaded.'}));
  if(S.sel==='all')renderAll(box,d);
  else{var s=d.shops.find(function(x){return x.id===S.sel;});
    box.appendChild(h('div',{class:'status'},h('span',{class:'dot '+fresh(s.receivedAt,d.now)}),h('span',{text:s.receivedAt?'Updated '+ago(s.receivedAt,d.now)+' ('+when(new Date(s.receivedAt).toISOString())+')':'Waiting for the first update'}),
      (s.receivedAt&&(d.now-s.receivedAt)/60000>180)?h('span',{class:'muted',text:'· the shop computer may be off or offline'}):null));
    renderShop(box,s,d);}
  root.appendChild(box);
  root.appendChild(h('div',{class:'foot',text:'Numbers are sent by each shop when its computer is online. This page refreshes every minute.'}));
  app.replaceChildren(root);
}

if(S.token)load();else showLogin('');
})();
